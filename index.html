
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Cósmico</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #101329;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        #instrucciones, #contador {
            position: fixed;
            top: 18px;
            padding: 12px 16px;
            color: #f4f1ff;
            background: rgba(25, 29, 58, 0.92);
            border: 1px solid #555b8c;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.7;
            z-index: 10;
        }

        #instrucciones {
            left: 18px;
        }

        #contador {
            right: 18px;
            font-weight: bold;
        }

        #mensaje {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff0a8;
            font-size: 25px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 8px #7667b5;
            pointer-events: none;
            z-index: 5;
        }

        @media (max-width: 600px) {
            #instrucciones, #contador {
                top: 10px;
                padding: 8px;
                font-size: 11px;
            }

            #instrucciones {
                left: 10px;
                max-width: 48%;
            }

            #contador {
                right: 10px;
            }
        }
    </style>
</head>

<body>
    <div id="instrucciones">
        🪐 UNIVERSO CÓSMICO
        <br>
        ¡Haz clic en los planetas, estrellas y lunas!
    </div>

    <div id="contador">
        ⭐ Atrapados: <span id="puntos">0</span>
        <br>
        🌌 En juego: <span id="cantidad">25</span>
    </div>

    <div id="mensaje"></div>

    <canvas id="canvas"></canvas>

    <script src="colision.js"></script>
</body>
</html>
